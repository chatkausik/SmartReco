<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartReco — behavioral AI recommendations{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script>
        // Apply saved theme before paint to avoid a flash.
        (function () {
            var t = localStorage.getItem("nc_theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
</head>
<body{% block body_attrs %}{% endblock %}>
<div class="bg-lines"></div>
<header class="nav">
    <a class="brand" href="/"><span class="logo">◈</span> SmartReco</a>
    <nav class="nav-links">
        <a href="/">Browse</a>
        <a href="/#catalog">Categories</a>
    </nav>
    <form class="nav-search" action="/products" method="get" role="search">
        <span aria-hidden="true">⌕</span>
        <input type="search" name="q" placeholder="Search courses, topics, tools…" aria-label="Search"
               value="{{ query or '' }}">
    </form>
    <div class="nav-right">
        <a class="icon-btn" href="/cart" title="Cart" aria-label="Cart">🛒<span class="cart-count" id="cart-count" hidden>0</span></a>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">☀</button>
        <a class="console-link" href="/mesh-console"><span class="spark">⚡</span> MeshAPI Console</a>
        {% if user %}
            <a class="nav-links" href="/recommendations" style="color:var(--muted)">For You</a>
            {% if user.is_admin %}<a class="nav-links" href="/admin" style="color:var(--muted)">Admin</a>{% endif %}
            <form action="/logout" method="post" class="inline-form">
                <button type="submit" class="link-button">Sign out</button>
            </form>
        {% else %}
            <a class="btn-signin" href="/login">Sign in</a>
        {% endif %}
    </div>
</header>

{% block full %}
<main class="container">
    {% block content %}{% endblock %}
</main>
{% endblock %}

<script src="/static/js/tracker.js"></script>
<script src="/static/js/signal.js"></script>
<script src="/static/js/cart.js"></script>
<script>
    (function () {
        var btn = document.getElementById("theme-toggle");
        function sync() {
            var t = document.documentElement.getAttribute("data-theme");
            btn.textContent = t === "dark" ? "☀" : "☾";
        }
        sync();
        btn.addEventListener("click", function () {
            var t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", t);
            localStorage.setItem("nc_theme", t);
            sync();
        });
    })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
